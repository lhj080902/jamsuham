plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

version = project.mod_version
group = 'kr.jamsuham'

base {
    archivesName = 'fastpack'
}

repositories {
    // Mod Menu (게임 안 설정 창 연결용, 실행에는 필요 없음)
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 바닐라와 같은 이름(모장 공식 매핑)
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Mod Menu API 만 컴파일에 사용 (jar 에 넣지 않음, 없어도 모드는 동작)
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

jar {
    from(rootProject.file('../../LICENSE')) {
        rename { "LICENSE_fastpack" }
    }
}
