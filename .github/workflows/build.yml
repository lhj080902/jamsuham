name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jamsuham-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk jamsuham.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" jamsuham.apk \
            --target "${{ github.sha }}" \
            --title "잠수함 빌드 #${{ github.run_number }}" \
            --notes "폰에서 아래 jamsuham.apk 를 눌러 받은 뒤 설치하세요. (처음 설치할 때 '출처를 알 수 없는 앱 설치'를 허용해야 합니다)"
