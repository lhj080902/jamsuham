name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Play 업로드 키 Secrets 가 등록돼 있으면 Play 판 AAB 를 그 키로 서명한다 (docs/RELEASE_KEY.md)
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
      # 정품 로그인 자체 client ID (Mojang 승인 후 저장소 Variables 또는 Secrets 에 MS_CLIENT_ID 로 등록. 없으면 공식 런처 ID)
      JAMSUHAM_MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID || secrets.MS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK (GitHub 판)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleGithubDebug

      - name: Upload artifact (GitHub 판 APK)
        uses: actions/upload-artifact@v4
        with:
          name: jamsuham-apk
          path: app/build/outputs/apk/github/debug/*.apk

      - name: Prepare upload key (Play 판)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build AAB (Play 판)
        env:
          JAMSUHAM_UPLOAD_STORE: ${{ env.HAS_UPLOAD_KEY == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          JAMSUHAM_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          JAMSUHAM_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          JAMSUHAM_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:bundlePlayRelease

      - name: Upload artifact (Play 판 AAB)
        uses: actions/upload-artifact@v4
        with:
          # 업로드 키가 없으면 디버그 키로 서명돼 Play 에는 올릴 수 없다 (빌드 확인용)
          name: ${{ env.HAS_UPLOAD_KEY == 'true' && 'jamsuham-play-aab' || 'jamsuham-play-aab-UNSIGNED-debugkey' }}
          path: app/build/outputs/bundle/playRelease/*.aab

      - name: Publish to Releases
        # 다른 브랜치에서 수동 실행했을 때 폰들이 그 빌드로 업데이트되지 않도록 main 에서만 게시
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/github/debug/app-github-debug.apk jamsuham.apk
          TAG="build-${{ github.run_number }}"
          # 보이는 버전(주.부.수)은 gradle.properties 의 jamsuham.version
          VERSION=$(grep '^jamsuham.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          gh release create "$TAG" jamsuham.apk \
            --target "${{ github.sha }}" \
            --title "잠수크래프트 v$VERSION (빌드 #${{ github.run_number }})" \
            --notes "폰에서 아래 jamsuham.apk 를 눌러 받은 뒤 설치하세요. (처음 설치할 때 '출처를 알 수 없는 앱 설치'를 허용해야 합니다)"
