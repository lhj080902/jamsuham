name: Build FastPack mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fastpack-mod/**'
      - '.github/workflows/mod.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/fastpack-mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace build 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Mixin 대상 확인 (믹스인 처리기 경고가 있으면 실패)
        run: |
          if grep -nE "Unable to locate obfuscation mapping|Cannot find target|No refMap loaded|not found in target|InvalidInjectionException" build.log; then
            echo "::error::Mixin 대상 HttpUtil.downloadFile 을 찾지 못했습니다"
            exit 1
          fi
          # refmap 에 downloadFile 이 실제로 들어갔는지
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          unzip -l "$JAR"
          REFMAP=$(unzip -Z1 "$JAR" | grep 'refmap.json$' | head -1)
          test -n "$REFMAP" || { echo "::error::jar 에 refmap 이 없습니다"; exit 1; }
          unzip -p "$JAR" "$REFMAP" | tee refmap.json
          unzip -p "$JAR" fastpack.mixins.json
          grep -q 'downloadFile' refmap.json || { echo "::error::refmap 에 downloadFile 매핑이 없습니다"; exit 1; }

      - name: 실제 HttpUtil.downloadFile 시그니처 출력
        run: |
          FOUND=""
          for J in $(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' 2>/dev/null); do
            if unzip -l "$J" 2>/dev/null | grep -q 'net/minecraft/util/HttpUtil.class'; then FOUND="$J"; break; fi
          done
          echo "매핑된 마인크래프트 jar: $FOUND"
          test -n "$FOUND" || { echo "::warning::매핑된 jar 를 찾지 못했습니다"; exit 0; }
          javap -cp "$FOUND" net.minecraft.util.HttpUtil | tee sig.txt
          javap -cp "$FOUND" 'net.minecraft.util.HttpUtil$DownloadProgressListener'
          grep -q 'public static java.nio.file.Path downloadFile(java.nio.file.Path, java.net.URL, java.util.Map<java.lang.String, java.lang.String>, com.google.common.hash.HashFunction, com.google.common.hash.HashCode, int, java.net.Proxy, net.minecraft.util.HttpUtil$DownloadProgressListener)' sig.txt \
            || { echo "::error::downloadFile 시그니처가 예상과 다릅니다"; exit 1; }
          echo "시그니처 확인 완료"
          # 다음 기능(재접속 때 같은 팩 다시 적용 안 하기) 준비용: 서버 리소스팩 관리 클래스 모양 출력
          for C in net.minecraft.client.resources.server.DownloadedPackSource net.minecraft.client.resources.server.ServerPackManager \
                   'net.minecraft.client.resources.server.ServerPackManager$ServerPackData' net.minecraft.client.resources.server.PackReloadConfig \
                   net.minecraft.client.resources.server.PackLoadFeedback net.minecraft.client.multiplayer.ClientCommonPacketListenerImpl; do
            echo "===== $C"; javap -p -cp "$FOUND" "$C" || true
          done
          # 바이트코드(재접속 때 리로드 생략 기능 설계용): 필요한 메서드만 골라 출력
          pick() { awk -v pat="$2" 'BEGIN{p=0} /^  [a-z].*[)];$|^  static [{][}];$/{p=($0 ~ pat)} p' ; }
          javap -c -p -cp "$FOUND" net.minecraft.client.resources.server.DownloadedPackSource \
            | pick x 'startReload|createReloadConfig|cleanupAfterDisconnect|onReloadSuccess|onRecovery|popAll|pushPack|method_|configureFor|loadRequestedPacks|createRepositorySource' > dps.txt
          javap -c -p -cp "$FOUND" net.minecraft.client.resources.server.ServerPackManager \
            | pick x 'triggerReloadIfNeeded|pushNewPack|markExistingPacksAsRemoved|popAll|cleanupRemovedPacks|tick|resetPromptStatus|method_55561' > spm.txt
          echo "##### DPS"; cat dps.txt | grep -v '^ *[0-9]*: \(aload\|astore\|iload\|istore\|dup\|pop\)' | head -400
          echo "##### SPM"; cat spm.txt | grep -v '^ *[0-9]*: \(aload\|astore\|iload\|istore\|dup\|pop\)' | head -400
          echo "##### INNER"; unzip -l "$FOUND" | grep 'client/resources/server/' | awk '{print $4}'
          for C in $(unzip -l "$FOUND" | grep -o 'net/minecraft/client/resources/server/DownloadedPackSource\$[0-9]*\.class' | sed 's/\.class//;s#/#.#g'); do
            echo "##### $C"; javap -c -p -cp "$FOUND" "$C" | grep -v '^ *[0-9]*: \(aload\|astore\|dup\|pop\)' | head -80
          done
          javap -p -cp "$FOUND" 'net.minecraft.client.resources.server.PackReloadConfig$Callbacks' 'net.minecraft.client.resources.server.PackReloadConfig$IdAndPath' || true
          javap -p -cp "$FOUND" net.minecraft.client.Minecraft | grep -i "reload\|downloadedpack" || true

      - uses: actions/upload-artifact@v4
        with:
          name: fastpack-mod
          path: tools/fastpack-mod/build/libs/*.jar
