org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
kotlin.code.style=official

# 앱 버전 (주.부.수) — 화면·릴리스 제목에 보이는 버전. 바꿀 때만 고친다
#   주(맨 앞): 엔진·구조가 바뀔 때 (예: 클라우드 서버 구조로 전환)
#   부(가운데): 큰 기능 추가·대규모 패치 → 수는 0 으로
#   수(맨 뒤): 버그 수정·작은 변경
# versionCode(빌드 번호)는 따로 GitHub Actions 실행 번호를 쓴다 (Play·앱 안 업데이트가 새 버전인지 비교하는 값이라 계속 커져야 함)
jamsuham.version=1.4.0
